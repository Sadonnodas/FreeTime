name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish. `id-token: write` is what lets
# deploy-pages prove to Pages that this artifact came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the second one finish rather than cancelling
# it — cancel-in-progress would risk leaving a half-published deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so CI builds the
      # same tree you built locally. `npm install` would be free to drift.
      - run: npm ci

      - run: npm run build

      # Pages must already be enabled with Source = "GitHub Actions" in
      # Settings > Pages. This step used to pass `enablement: true` to turn it
      # on automatically, but creating a Pages site needs admin rights that the
      # built-in GITHUB_TOKEN does not have, so it failed with "Resource not
      # accessible by integration". It is a one-time manual toggle instead.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
