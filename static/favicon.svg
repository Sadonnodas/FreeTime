<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FREETIME">
  <!-- The same low sun as the app icon: see tools/make-icons.py for why. -->
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff6482"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08080a"/>
  <circle cx="32" cy="32" r="30" fill="url(#bloom)"/>
  <circle cx="32" cy="32" r="19.2" fill="url(#orb)"/>
</svg>
